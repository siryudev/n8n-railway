services:
  - type: web
    name: n8n-telegram
    env: node
    plan: free
    buildCommand: npm install
    startCommand: n8n start
    envVars:
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PORT
        value: 5678
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: your-strong-password-here
      - key: TELEGRAM_BOT_TOKEN
        value: 8530107304:AAEvHT9ZzZYhaCwSDiZyIbnbHir01oE0bYo
